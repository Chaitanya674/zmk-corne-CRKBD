# Applies to BOTH halves (corne_left and corne_right).

# ---------------------------------------------------------------
# OLED display
# ---------------------------------------------------------------
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Render on a dedicated work queue. Without this the display shares the
# system work queue with the BLE and matrix scanning work, and on the
# peripheral half that is a common reason the screen never gets its first
# flush and just sits blank.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# ---------------------------------------------------------------
# LVGL: force 1 bit per pixel.
# If LVGL renders at 16bpp into a 1bpp framebuffer, the byte stream the
# driver pushes is meaningless and you get a solid lit panel. Set this
# explicitly rather than relying on a default.
# ---------------------------------------------------------------
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_LV_DPI_DEF=161

# Redraw the whole screen each time. Partial refresh on page-addressed
# OLED controllers leaves stale lit rows behind.
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_Z_DOUBLE_VDB=n

# ---------------------------------------------------------------
# RGB underglow
# ---------------------------------------------------------------
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y

# MUST STAY OFF on this build.
# The right half has no battery: it is powered through the TRRS cable's VCC
# wire, which is the left nice!nano's switched external power rail (the same
# rail that feeds the LEDs and OLEDs). With EXT_POWER=y, toggling RGB off
# switches that rail off, the right half loses power, and because both the
# RGB and ext-power states are saved, it stays dead on every boot after.
# With this off, RGB off just blanks the LEDs and the rail stays on.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Both halves' LEDs and OLEDs run off the left nice!nano's single 3.3V
# regulator. Cap brightness so full-white doesn't sag the rail and brown out
# the right half (or reset the left).
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=50

# ---------------------------------------------------------------
# Radio
# ---------------------------------------------------------------
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ---------------------------------------------------------------
# Useful while debugging the display. Uncomment, flash, and read the
# console over USB to see whether the SSD1306 probe actually succeeded.
# Remove once things work - logging costs flash and battery.
# ---------------------------------------------------------------
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG=y
# CONFIG_DISPLAY_LOG_LEVEL_DBG=y
# CONFIG_I2C_LOG_LEVEL_DBG=y
